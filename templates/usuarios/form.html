<!DOCTYPE html>

<html xmlns:th="http://thymeleaf.org" lang="en">

<head>

    <meta charset="UTF-8">
    <meta meta="viewport" content="width=device-width, initial-scale=1">

    <title>Nuevo Usuario</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4>Nuevo Usuario</h4>
        </div>

        <div class="card-body">

  <form th:action="@{/usuarios/save}"
        th:object="${usuario}"
        method="post">

      <input type="hidden" th:field="*{id}">

      <div class="row">

      <div class="col-md-6">
          <label class="form-label">
              Usuario
          </label>

          <input type="text"
          class="form-control"
          th:field="*{usuario}">
      </div>

      <div class="mb-3">
          <label class="form-label">
              Contraseña
          </label>

          <input type="password"
          class="form-control"
          th:field="*{clave}">
      </div>
      </div>

      <div class="row mt-3">

      <div class="col-md-6">
          <label class="form-label">
              Rol
          </label>

          <select class="form-select"
          th:field="*{rol}">
              <option th:each="r:${rol}"
                      th:value="${r.id}"
                      th:text="${r.descrip}">
              </option>

          </select>

      </div>

          <div class="mb-3">
              <label class="form-label">
                  Inactivo
              </label>

              <input type="checkbox"
                     class="form-chek-input"
                     th:field="*{inactivo}">
          </div>
      </div>

      <div class="mt-4">
          <button type="submit"
                  class="btn btn-success">
              Guardar
          </button>
          <a th:href="@{/usuarios}"
             class="btn btn-secondary">
              Cancelar
          </a>
      </div>
  </form>



</div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
