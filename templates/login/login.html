<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Sistema de Reclamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm border-0" style="width: 100%; max-width: 400px;">
    <div class="card-body p-4 text-center">
        <h3 class="card-title fw-bold mb-3">Acceso al Sistema</h3>
        <p class="text-muted mb-4">Ingresa tus credenciales de soporte</p>

        <!-- Alerta de Error -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2" role="alert">
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Alerta de Logout -->
        <div th:if="${logoutMessage}" class="alert alert-success py-2" role="alert">
            <span th:text="${logoutMessage}"></span>
        </div>

        <!-- Formulario procesado automáticamente por Spring Security -->
        <form th:action="@{/login}" method="post">
            <div class="form-floating mb-3 text-start">
                <input type="text" class="form-control" id="username" name="username" placeholder="Usuario" required autofocus>
                <label for="username">Nombre de usuario</label>
            </div>

            <div class="form-floating mb-4 text-start">
                <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                <label for="password">Contraseña</label>
            </div>

            <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">Ingresar</button>
        </form>
    </div>
</div>

</body>
</html>
