<!DOCTYPE html>

<html xmlns:th="http://thymeleaf.org" lang="en">

<head>

    <meta charset="UTF-8">
    <meta meta="viewport" content="width=device-width, initial-scale=1">

    <title>Nuevo Contrato</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4>Nuevo Contrato</h4>
        </div>

        <div class="card-body">

  <form th:action="@{/contratos/save}"
        th:object="${contrato}"
        method="post">

      <input type="hidden" th:field="*{id}">

      <div class="row">

      <div class="col-md-6">
          <label class="form-label">
              Fecha de Alta
          </label>

          <input type="date"
          class="form-control"
          th:field="*{feAlta}">
      </div>

      <div class="col-md-6">
          <label class="form-label">
              Fecha de Baja
          </label>

          <input type="date"
          class="form-control"
          th:field="*{feBaja}">
      </div>
      </div>

      <div class="row mt-3">

      <div class="col-md-6">
          <label class="form-label">
              Cliente
          </label>

          <select class="form-select"
          th:field="*{cliente}">
              <option th:each="c:${cliente}"
                      th:value="${c.id}"
                      th:text="${c.nom}">
              </option>

          </select>

      </div>

          <div class="col-md-6">
              <label class="form-label">
                  Servicio
              </label>

              <select class="form-select"
                      th:field="*{servicio}">
                  <option th:each="s:${servicio}"
                          th:value="${s.id}"
                          th:text="${s.descrip}">
                  </option>

              </select>
          </div>
      </div>

      <div class="mt-4">
          <button type="submit"
                  class="btn btn-success">
              Guardar
          </button>
          <a th:href="@{/contratos}"
             class="btn btn-secondary">
              Cancelar
          </a>
      </div>
  </form>



</div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
