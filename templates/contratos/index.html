<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Contratos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>Listado de Contratos</h2>

        <a th:href="@{/contratos/create}" class="btn btn-primary">
            Nuevo Contrato
        </a>
    </div>

    <table class="table table-striped table-hover table-bordered">

        <thead class="table-dark">

        <tr>
            <th>Id</th>
            <th>Fecha de Alta</th>
            <th>Fecha de Baja</th>
            <th>Cliente</th>
            <th>Servicio</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="c:${contratos}">

            <td th:text="${c.id}"></td>

            <td th:text="${c.feAlta}"></td>

            <td th:text="${c.feBaja}"></td>

            <td th:text="${c.cliente.nom}"></td>

            <td th:text="${c.servicio.descrip}"></td>

            <td>
                <a th:href="@{/contratos/edit/{id}(id=${c.id})}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a th:href="@{/contratos/delete/{id}(id=${c.id})}"
                   class="btn btn-danger btn-sm"
                onclick="return confirm ('¿Estas seguro que desea eliminar este contrato');">
                    Eliminar
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
