<!DOCTYPE html>

<html xmlns:th="http://thymeleaf.org" lang="en">

<head>

    <meta charset="UTF-8">
    <meta meta="viewport" content="width=device-width, initial-scale=1">

    <title>Nuevo Reclamo</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4>Nuevo Reclamo</h4>
        </div>

        <div class="card-body">

  <form th:action="@{/reclamos/save}"
        th:object="${reclamos}"
        method="post"
        enctype="multipart/form-data" >

      <input type="hidden" th:field="*{id}">

      <div class="row">

      <div class="col-md-6">
          <label class="form-label">
              Asunto
          </label>

          <input type="text"
          class="form-control"
          th:field="*{asunto}">
      </div>

      <div class="mb-3">
          <label class="form-label">
              Fecha
          </label>

          <input type="date"
          class="form-control"
          th:field="*{fecha}">
      </div>
      </div>

      <div class="row mt-3">

          <label class="form-label">
              Fecha y Hora
          </label>

          <input type="datetime-local"
                 class="form-control"
                 th:field="*{feHora}">
      </div>

      <div class="col-md-6">
          <label class="form-label">
              Cliente
          </label>

          <select class="form-select"
          th:field="*{cliente}">
              <option th:each="c:${cliente}"
                      th:value="${c.id}"
                      th:text="${c.nom + ' ' + c.ape}">
              </option>

          </select>

      </div>

      <div class="col-md-6">
          <label class="form-label">
              Contrato
          </label>

          <select class="form-select"
                  th:field="*{contrato}">
              <option th:each="c:${contrato}"
                      th:value="${c.id}"
                      th:text="${c.feAlta}">
              </option>

          </select>

      </div>

      <div class="col-md-6">
          <label class="form-label">
              Motivo
          </label>

          <select class="form-select"
                  th:field="*{motivosReclamo}">
              <option th:each="m:${motivosReclamo}"
                      th:value="${m.id}"
                      th:text="${m.descrip}">
              </option>

          </select>

      </div>

      <div class="col-md-6">
          <label class="form-label">
              Estado
          </label>

          <select class="form-select"
                  th:field="*{reclamosEstado}">
              <option th:each="e:${reclamosestado}"
                      th:value="${e.id}"
                      th:text="${e.descrip}">
              </option>

          </select>

      </div>

          <div class="col-md-6">
              <label class="form-label">
                  Mensaje
              </label>

              <input type="text"
              class="form-control"
              th:field="*{mensaje}">
          </div>

      <div class="row mt-3">

      <div class="col-md-6">
          <label class="form-label">
              Observacion
          </label>

          <input type="text"
          class="form-control"
          th:field="*{observacion}">
      </div>

          <div class="mb-3">
              <label class="form-label">
                  Finalizado
              </label>

              <input type="checkbox"
                     class="form-chek-input"
                     th:field="*{finalizado}">
          </div>
      </div>


      <hr class="my-4">

      <h4>Respuestas del Reclamo</h4>

      <div class="card mt-3">

          <div class="card-body">

              <div th:if="${reclamos.reclamosRespuestas == null
                     or #lists.isEmpty(reclamos.reclamosRespuestas)}">

                  <p class="text-muted">
                      Este reclamo todavía no tiene respuestas.
                  </p>

              </div>

              <div th:each="respuesta : ${reclamos.reclamosRespuestas}"
                   class="border rounded p-3 mb-2">

                  <strong th:text="${respuesta.fecha}">
                      Fecha
                  </strong>

                  <p th:text="${respuesta.prioridad}">
                      Contenido de la respuesta
                  </p>

              </div>

              <a th:href="@{/reclamos/{id}/respuestas/create(id=${reclamos.id})}"
                 class="btn btn-info">
                  Agregar respuesta
              </a>

          </div>

      </div>

      <hr class="my-4">

      <h4>Archivos adjuntos</h4>

      <div class="card mt-3">

          <div class="card-body">

              <div th:if="${reclamos.reclamosFiles == null
                     or #lists.isEmpty(reclamos.reclamosFiles)}">

                  <p class="text-muted">
                      Este reclamo no tiene archivos adjuntos.
                  </p>

              </div>

              <div th:each="archivo : ${reclamos.reclamosFiles}"
                   class="border rounded p-3 mb-2">

            <span th:text="${archivo.file}">
                archivo.pdf
            </span>

                  <a th:href="@{/reclamos/files/{id}(id=${reclamos.id})}"
                     class="btn btn-sm btn-primary">
                      Ver
                  </a>

              </div>

              <div class="mt-3">
                  <label class="form-label font-weight-bold">Subir / Adjuntar archivos:</label>
                  <!-- Agregado el atributo 'multiple' y actualizado el 'name' -->
                  <input type="file" name="archivosAdjuntos" class="form-control" multiple />
              </div>

          </div>

      </div>

      <div class="mt-4">
          <button type="submit"
                  class="btn btn-success">
              Guardar
          </button>
          <a th:href="@{/reclamos}"
             class="btn btn-secondary">
              Cancelar
          </a>
      </div>
  </form>



</div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
