<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Agregar Respuesta</title>

    <link

        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">"

</head>

<body>

<div class="container mt-4">

    <div class="card">

        <div class="card-header">
            <h2>Agregar Respuesta</h2>
        </div>

        <div class="card-body">

            <form
                th:action="@{/reclamos/respuestas/save}"
                th:object="${respuesta}"
                method="post">

                <input type="hidden" th:field="*{reclamo.id}">

                <div class="mb-3">

                    <label class="form-label">
                        Reclamo
                    </label>

                    <input type="text" class="form-control" th:value="${reclamo.asunto}" readonly>

                </div>

                <input type="date" th:field="*{fecha}">

                <input type="datetime-local" th:field="*{feHora}">

                <input type="number" th:field="*{prioridad}">




                <div class="mb-3">

                    <label class="form-label">
                        Respuesta
                    </label>

                    <textarea class="form-control" rows="5" th:field="*{mensaje}" placeholder="Ingrese la respuesta al reclamo...">

                    </textarea>

                </div>

                <div class="mt-3">

                    <button type="submit" class="btn btn-success">Guardar</button>

                    <a th:href="@{/reclamos}" class="btn btn-secondary">Cancelar</a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
