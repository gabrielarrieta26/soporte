<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Agregar Archivo</title>

    <link

        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">"

</head>

<body>

<div class="container mt-4">

    <div class="card">

        <div class="card-header">
            <h2>Agregar Archivo</h2>
        </div>

        <div class="card-body">

            <form
                th:action="@{/reclamos/files/save}"
                th:object="${file}"
                method="post">

                <input type="hidden" th:field="*{reclamo.id}">

                <div class="mb-3">

                    <label class="form-label">
                        Reclamo
                    </label>

                    <input type="text" class="form-control" th:value="${reclamo.asunto}" readonly>

                </div>

                <div class="mb-3">
                    <label for="fileInput" class="form-label">Adjuntar Archivo:</label>

                    <input type="file" name="file" id="fileInput" class="form-control" />
                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Archivo
                    </label>

                </div>

                <div class="mt-3">

                    <button type="submit" class="btn btn-success">Guardar</button>

                    <a th:href="@{/reclamos}" class="btn btn-secondary">Cancelar</a>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
