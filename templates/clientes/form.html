<!DOCTYPE html>

<html xmlns:th="http://thymeleaf.org" lang="en">

<head>

    <meta charset="UTF-8">
    <meta meta="viewport" content="width=device-width, initial-scale=1">

    <title>Nuevo cliente</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4>Nuevo Cliente</h4>
        </div>

        <div class="card-body">

  <form th:action="@{/clientes/save}"
        th:object="${cliente}"
        method="post">

      <input type="hidden" th:field="*{id}">

      <div class="row">

          <div class="row mt-3">

          <div class="col-md-6">
              <label class="form-label">
                  Tipo de Documento
              </label>

              <select class="form-select"
                      th:field="*{tiposDoc}">
                  <option th:each="t:${tiposDoc}"
                          th:value="${t.id}"
                          th:text="${t.descrip}">
                  </option>

              </select>

          </div>



          <div class="col-md-6">
              <label class="form-label">
                  Numero Documento
              </label>

              <input type="text"
                     class="form-control"
                     th:field="*{nrodoc}">
          </div>
      </div>

          <div class="row mt-3">

      <div class="col-md-6">
          <label class="form-label">
              Apellido
          </label>

          <input type="text"
          class="form-control"
          th:field="*{ape}">
      </div>

      <div class="col-md-6">
          <label class="form-label">
              Nombres
          </label>

          <input type="text"
          class="form-control"
          th:field="*{nom}">
      </div>
      </div>
      </div>


      <div class="row mt-3">

      <div class="col-md-6">
          <label class="form-label">
              Direccion
          </label>

          <input type="text"
          class="form-control"
          th:field="*{direccion}">
      </div>

      <div class="col-md-6">
          <label class="form-label">
              Telefono
          </label>

          <input type="text"
          class="form-control"
          th:field="*{telefono}">
      </div>
      </div>

      <div class="row mt-3">

      <div class="col-md-6">
          <label class="form-label">
              Email
          </label>

          <input type="text"
          class="form-control"
          th:field="*{email}">
      </div>

          <div class="col-md-6">
              <label class="form-label">
                  Usuario
              </label>

              <select class="form-select"
                      th:field="*{usuario}">
                  <option th:each="u:${usuario}"
                          th:value="${u.id}"
                          th:text="${u.usuario}">
                  </option>

              </select>
          </div>
      </div>

      <div class="mt-4">
          <button type="submit"
                  class="btn btn-success">
              Guardar
          </button>
          <a th:href="@{/clientes}"
             class="btn btn-secondary">
              Cancelar
          </a>
      </div>
  </form>



</div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
