<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Clientes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>Listado de Clientes</h2>

        <a th:href="@{/clientes/create}" class="btn btn-primary">
            Nuevo Cliente
        </a>
    </div>

    <table class="table table-striped table-hover table-bordered">

        <thead class="table-dark">

        <form th:action="@{/clientes/search}" method="get" class="row mb-4">

            <div class="col-md-6">
                <input type="text"
                       name="search"
                       class="form-control"
                       placeholder="Buscar por número de documento">
            </div>

            <div class="col-md-2">
                <button type="submit"
                        class="btn btn-primary">
                    Buscar
                </button>
            </div>

            <div class="col-md-2">
                <a th:href="@{/clientes/search}"
                   class="btn btn-secondary">
                    Limpiar
                </a>
            </div>

        </form>

        <tr>
            <th>Id</th>
            <th>Apellido</th>
            <th>Nombres</th>
            <th>Tipo Documento</th>
            <th>Numero Documento</th>
            <th>Direccion</th>
            <th>Telefono</th>
            <th>Email</th>
            <th>Usuario</th>
            <th>Acciones</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="c:${clientes}">

            <td th:text="${c.id}"></td>

            <td th:text="${c.ape}"></td>

            <td th:text="${c.nom}"></td>

            <td th:text="${c.tiposDoc.descrip}"></td>

            <td th:text="${c.nrodoc}"></td>

            <td th:text="${c.direccion}"></td>

            <td th:text="${c.telefono}"></td>

            <td th:text="${c.email}"></td>

            <td th:text="${c.usuario?.usuario ?: 'Sin usuario'}"></td>

            <td>
                <a th:href="@{/clientes/edit/{id}(id=${c.id})}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a th:href="@{/clientes/delete/{id}(id=${c.id})}"
                   class="btn btn-danger btn-sm"
                onclick="return confirm ('¿Estas seguro que desea eliminar este cliente');">
                    Eliminar
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
